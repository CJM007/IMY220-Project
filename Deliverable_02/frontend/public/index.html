<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05070D" />
    <meta name="description" content="Chitambala Sikazwe's portfolio, told as a mission log from a ship heading further out than anyone on board has gone before." />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Into the Unknown | Chitambala Sikazwe</title>
  </head>
  <body>
    <noscript>This portfolio needs JavaScript to run.</noscript>
    <div id="root"></div>
    <!-- Netlify reads this copy of the contact form when the site is deployed. The React form posts to it. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
